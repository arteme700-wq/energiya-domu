plugins { id 'com.android.application' }

def ks = new Properties()
def ksCandidates = [
    file("${rootProject.projectDir}/../keystore/keystore.properties"),
    file('/workspace/sister_app/keystore/keystore.properties'),
]
def ksf = ksCandidates.find { it.exists() }
if (ksf != null) ks.load(new FileInputStream(ksf))
def storeFileCand = [
    ksf != null ? new File(ksf.parentFile, 'release.jks') : null,
    file("${rootProject.projectDir}/../keystore/release.jks"),
    file('/workspace/sister_app/keystore/release.jks'),
].find { it != null && it.exists() }

// MQTT broker secrets: never in git. Env file (BROKER_HOST, BROKER_PORT_TLS, PHONE_USER, PHONE_PASS)
// or environment variables. Empty → feature shows "broker not configured" and sends nothing.
def remoteProps = new Properties()
def envCandidates = [
    file("${rootProject.projectDir}/../secrets/hivemq.env"),
    file("${rootProject.projectDir}/secrets/hivemq.env"),
    file('/workspace/jkapp/secrets/hivemq.env'),
    file("${System.getenv('HOME')}/secrets/hivemq.env"),
    file('/etc/bms-remote/mqtt-phone.env'),
]
envCandidates.findAll { it.exists() }.each { f ->
    f.eachLine { line ->
        def s = line.trim()
        if (!s || s.startsWith('#') || !s.contains('=')) return
        def i = s.indexOf('=')
        remoteProps[s.substring(0, i).trim()] = s.substring(i + 1).trim().replaceAll(/^"|"$/, '')
    }
}
['BROKER_HOST', 'BROKER_PORT_TLS', 'BROKER_PORT', 'PHONE_USER', 'PHONE_PASS'].each { k ->
    def v = System.getenv(k)
    if (v) remoteProps[k] = v
}
def bcStr = { String v ->
    def s = v ?: ''
    return '"' + s.replace('\\', '\\\\').replace('"', '\\"') + '"'
}
def remoteHost = (remoteProps['BROKER_HOST'] ?: '') as String
def remotePort = (remoteProps['BROKER_PORT_TLS'] ?: remoteProps['BROKER_PORT'] ?: '8883') as String
def remoteUser = (remoteProps['PHONE_USER'] ?: '') as String
def remotePass = (remoteProps['PHONE_PASS'] ?: '') as String
if (!remoteHost || !remoteUser) {
    logger.warn('BMS Remote broker secrets missing — MQTT will be disabled in this APK')
}

android {
    namespace 'ua.sister.energy'
    compileSdk 34
    defaultConfig {
        applicationId "ua.sister.energy"
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName "1.5.5"
        buildConfigField 'String', 'REMOTE_HOST', bcStr(remoteHost)
        buildConfigField 'int', 'REMOTE_PORT', (remotePort.isInteger() ? remotePort : '8883')
        buildConfigField 'String', 'REMOTE_USER', bcStr(remoteUser)
        buildConfigField 'String', 'REMOTE_PASS', bcStr(remotePass)
    }
    signingConfigs {
        release {
            if (storeFileCand != null) storeFile storeFileCand
            storePassword ks['storePassword']
            keyAlias ks['keyAlias']
            keyPassword ks['keyPassword']
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildFeatures { buildConfig true }
    lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
}
